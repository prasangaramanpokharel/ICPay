    <circle cx="34" cy="45" r="8" stroke="#e4e4e7" stroke-width="2" />
    <text x="64" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Event trigger</text>
    <text x="64" y="58" fill="#a1a1aa" font-family="monospace" font-size="10.5">Dynamic delays and retries</text>
  </g>

  <g transform="translate(665, 140)">
    <rect width="250" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="34" cy="45" r="18" fill="#27272a" />
