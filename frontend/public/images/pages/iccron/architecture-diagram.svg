    <text x="64" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">API trigger</text>
    <text x="64" y="58" fill="#a1a1aa" font-family="monospace" font-size="10.5">POST /api/v1/cron/trigger</text>
  </g>

  <g transform="translate(25, 330)">
    <rect width="250" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
