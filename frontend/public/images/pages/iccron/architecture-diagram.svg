<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <circle cx="470" cy="240" r="170" fill="url(#glowGrad)" opacity="0.15" filter="url(#blurGlow)" />

  <rect x="350" y="150" width="240" height="180" rx="24" fill="url(#cardBg)" stroke="url(#glowGrad)" stroke-width="2" />
  <rect x="370" y="170" width="200" height="32" rx="10" fill="#27272a" opacity="0.6" />
  <text x="470" y="191" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">ICCRON CANISTER CORE</text>
  <text x="470" y="230" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Autonomous Timer Engine</text>
  <text x="470" y="255" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Native IC Canister Timers</text>
  <text x="470" y="275" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">1-second Tick Precision</text>
  <rect x="380" y="295" width="180" height="20" rx="6" fill="#10b981" fill-opacity="0.15" />
  <text x="470" y="309" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">100% ON-CHAIN ESCROW</text>

  <g transform="translate(25, 90)">
