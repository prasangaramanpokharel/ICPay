  <path d="M275 255 L 350 240" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M275 375 C 310 375, 310 280, 350 280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <path d="M590 210 C 630 210, 630 185, 665 185" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M590 270 C 630 270, 630 305, 665 305" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" fill="none" />
