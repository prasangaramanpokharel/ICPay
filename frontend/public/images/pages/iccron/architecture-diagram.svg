    <circle cx="34" cy="45" r="18" fill="#3b82f6" fill-opacity="0.15" />
    <path d="M27 45h14M34 38v14" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    <text x="64" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Cron Schedules</text>
    <text x="64" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">0 */2 * * *</text>
  </g>

  <g transform="translate(25, 210)">
