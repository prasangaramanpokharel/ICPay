<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.98" />
    </linearGradient>
  </defs>

  <rect x="340" y="140" width="260" height="200" rx="20" fill="url(#cardBg)" stroke="#3f3f46" stroke-width="1.5" />
  <rect x="365" y="160" width="210" height="30" rx="8" fill="#27272a" />
  <text x="470" y="180" text-anchor="middle" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">icCron Canister Core</text>
  <text x="470" y="222" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Timer Engine</text>
  <text x="470" y="248" text-anchor="middle" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12">Canister timers</text>
  <text x="470" y="270" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">1-second tick precision</text>
  <rect x="375" y="295" width="190" height="24" rx="6" fill="#27272a" />
  <text x="470" y="311" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="11">State in stable memory</text>

  <g transform="translate(25, 90)">
