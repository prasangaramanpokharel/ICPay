    <circle cx="34" cy="45" r="18" fill="#10b981" fill-opacity="0.15" />
    <path d="M26 45h16M36 39l6 6-6 6" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Canister Calls</text>
    <text x="64" y="58" fill="#a1a1aa" font-family="monospace" font-size="10.5">Inter-canister Candid</text>
  </g>

  <g transform="translate(665, 260)">
