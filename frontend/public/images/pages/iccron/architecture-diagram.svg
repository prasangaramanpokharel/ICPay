    <circle cx="34" cy="45" r="18" fill="#f59e0b" fill-opacity="0.15" />
    <path d="M27 42l7-7 7 7M34 35v16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">HTTPS Outcalls</text>
    <text x="64" y="58" fill="#a1a1aa" font-family="monospace" font-size="10.5">Vercel, AWS, Cloudflare</text>
