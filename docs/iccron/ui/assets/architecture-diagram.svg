<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.95" />
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="450" cy="240" r="160" fill="url(#glowGrad)" opacity="0.15" filter="url(#blurGlow)" />

  <!-- Center Core Engine: icCron Canister -->
  <rect x="330" y="150" width="240" height="180" rx="24" fill="url(#cardBg)" stroke="url(#glowGrad)" stroke-width="2" />
  <rect x="350" y="170" width="200" height="32" rx="10" fill="#27272a" opacity="0.6" />
  <text x="450" y="191" text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">ICCRON CANISTER CORE</text>
  <text x="450" y="230" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Autonomous Timer Engine</text>
  <text x="450" y="255" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Native IC Canister Timers</text>
  <text x="450" y="275" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">1-second Tick Precision</text>
  <rect x="360" y="295" width="180" height="20" rx="6" fill="#10b981" fill-opacity="0.15" />
  <text x="450" y="309" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">100% ON-CHAIN ESCROW</text>

  <!-- Left: Triggers & Sources -->
  <g transform="translate(40, 90)">
    <rect width="210" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="35" cy="45" r="18" fill="#3b82f6" fill-opacity="0.15" />
    <path d="M28 45h14M35 38v14" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
    <text x="65" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Cron Schedules</text>
    <text x="65" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">0 */2 * * *</text>
  </g>

  <g transform="translate(40, 210)">
    <rect width="210" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="35" cy="45" r="18" fill="#ec4899" fill-opacity="0.15" />
    <path d="M28 45l5 5 10-10" stroke="#f472b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">API Key Webhooks</text>
    <text x="65" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">POST /api_trigger_job</text>
  </g>

  <g transform="translate(40, 330)">
    <rect width="210" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="35" cy="45" r="18" fill="#8b5cf6" fill-opacity="0.15" />
    <circle cx="35" cy="45" r="8" stroke="#a78bfa" stroke-width="2" />
    <text x="65" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Event Driven</text>
    <text x="65" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">Dynamic Delays & Retries</text>
  </g>

  <!-- Right: Targets -->
  <g transform="translate(650, 140)">
    <rect width="210" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="35" cy="45" r="18" fill="#10b981" fill-opacity="0.15" />
    <path d="M27 45h16M37 39l6 6-6 6" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Canister Calls</text>
    <text x="65" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">Inter-canister Candid</text>
  </g>

  <g transform="translate(650, 260)">
    <rect width="210" height="90" rx="16" fill="url(#cardBg)" stroke="#27272a" stroke-width="1.5" />
    <circle cx="35" cy="45" r="18" fill="#f59e0b" fill-opacity="0.15" />
    <path d="M28 42l7-7 7 7M35 35v16" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="65" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">HTTPS Outcalls</text>
    <text x="65" y="58" fill="#a1a1aa" font-family="monospace" font-size="11">Vercel, AWS, Cloudflare</text>
  </g>

  <!-- Connective Arrows & Data Flow -->
  <path d="M250 135 C 290 135, 290 200, 330 200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M250 255 L 330 240" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M250 375 C 290 375, 290 280, 330 280" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" fill="none" />

  <path d="M570 210 C 610 210, 610 185, 650 185" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none" />
  <path d="M570 270 C 610 270, 610 305, 650 305" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" fill="none" />
</svg>