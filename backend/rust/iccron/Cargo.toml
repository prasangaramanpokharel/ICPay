[package]
name = "iccron"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "iccron"

[dependencies]
ic-cdk = "0.19"
ic-cdk-timers = "1.0"
candid = "0.10"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
